<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcement Bar</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center p-0"
        style="background: linear-gradient(rgba(0, 0, 0, 0.548), rgba(0,0,0,0.7)), url('image/bg.mp4') center/cover no-repeat;">
        <div class="position-absolute top-0 start-0 w-100 h-100 bg-dark opacity-75" style="z-index: -1;"></div>
        <video autoplay muted loop playsinline class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover"
            style="z-index: -1;">
            <source src="image/bg.mp4"  type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="container py-5">
            <div class="row align-items-center justify-content-center g-5">

                <!-- Left Side: Welcome Content & Socials -->
                <div class="col-lg-6 text-white ">
                    <div class="d-flex align-items-center gap-2 mb-4">
                        <a href="index.html"><img src="image/footer-logo.png" class="w-50 ms-0" alt="Header-logo"></a>
                    </div>
                    <h1 class="fw-bold display-5 mb-2">Welcome!</h1>
                    <h3 class="fw-bold fs-4 mb-4 text-white-50">To The Future</h3>
                    <p class="text-white-50 mb-4 small" style="max-width: 450px;">
                        Friday is an international E-commarce site. Open for Buyers, Sellers, and Dealers. Buy-Sell-Grow
                        Trusted and world wide acknowlagde.
                    </p>
                    <div class="d-flex gap-3 text-white">
                        <a href="#" class="text-white text-decoration-none"><i class="fa-brands fa-facebook-f"></i></a>
                        <a href="#" class="text-white text-decoration-none"><i class="fa-brands fa-twitter"></i></a>
                        <a href="#" class="text-white text-decoration-none"><i class="fa-brands fa-youtube"></i></a>
                        <a href="#" class="text-white text-decoration-none"><i class="fa-brands fa-linkedin-in"></i></a>
                    </div>
                </div>

                <!-- Right Side: Login Card Form -->
                <div class="col-lg-5 col-md-8">
                    <div class="p-4 p-md-5 rounded-4 text-white"
                        style="background: rgba(18, 18, 18, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1);">

                        <h3 class="fw-bold text-center mb-4">Login In</h3>

                        <form>
                            <!-- Email Field -->
                            <div class="mb-4">
                                <label class="form-label small text-white-50 fw-medium">Email</label>
                                <div class="input-group border-bottom border-light pb-1">
                                    <input type="email"
                                        class="form-control bg-transparent border-0 text-white shadow-none p-0"
                                        placeholder="" required>
                                    <span class="input-group-text bg-transparent border-0 text-white-50"><i
                                            class="fa-regular fa-envelope"></i></span>
                                </div>
                            </div>

                            <!-- Password Field -->
                            <div class="mb-3">
                                <label class="form-label small text-white-50 fw-medium">Password</label>
                                <div class="input-group border-bottom border-light pb-1">
                                    <input type="password"
                                        class="form-control bg-transparent border-0 text-white shadow-none p-0"
                                        placeholder="" required>
                                    <span class="input-group-text bg-transparent border-0 text-white-50"><i
                                            class="fa-solid fa-lock"></i></span>
                                </div>
                            </div>

                            <!-- Remember Me & Forgot Password -->
                            <div class="d-flex justify-content-between align-items-center mb-4 small">
                                <div class="form-check">
                                    <input type="checkbox"
                                        class="form-check-input bg-transparent border-light shadow-none" id="remember">
                                    <label class="form-check-label text-white-50" for="remember">Remember Me</label>
                                </div>
                                <a href="#" class="text-white text-decoration-none small">Forget Password</a>
                            </div>

                            <!-- Submit Button -->
                            <button type="submit"
                                class="btn btn-danger w-100 py-2 rounded-pill fw-medium text-white mb-4"
                                style="background: linear-gradient(45deg, #2a9fff, #0042d1); border: none;">
                                Log In
                            </button>
                            <div class="row">
                                <div class="col-4">  
                                       <a class="btn btn-danger w-100 py-2 rounded-pill fw-medium text-white mb-4"
                                         href="https://www.google.com/" style="background: linear-gradient(45deg, #2a9fff, #0042d1); border: none;"><i class="fa-brands fa-google"></i></a>
                                </div>
                                <div class="col-4">
                                    
                                        <a class="btn btn-danger w-100 py-2 rounded-pill fw-medium text-white mb-4"
                                         href="https://www.facebook.com/" style="background: linear-gradient(45deg, #2a9fff, #0042d1); border: none;"><i class="fa-brands fa-facebook"></i></a>

                                </div>
                                <div class="col-4">    
                                        <a class="btn btn-danger w-100 py-2 rounded-pill fw-medium text-white mb-4"
                                         href="index.html" style="background: linear-gradient(45deg, #2a9fff, #0042d1); border: none;"><i class="fa-solid fa-circle-user"></i></a>
                                </div>
                            </div>

                            <!-- Signup Redirect -->
                            <div class="text-center small text-white-50">
                                Dont have a account? <a href="registor.html" class="text-white fw-bold text-decoration-none">Sign
                                    Up</a>
                            </div>
                            <div class="text-center small mt-3">
                                <a href="index.html" class="text-white-50 text-decoration-none">Back to shopping</a>
                                <span class="text-white-50 mx-2">&bull;</span>
                                <a href="help.html" class="text-white-50 text-decoration-none">Help</a>
                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
